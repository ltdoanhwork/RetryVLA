# ACR (Active Causal Recovery) PoC, user 2026-11-09. Design + pre-registered gates: experiments/PLAN.md "ACR".
# Same instances / protocol / pi0 / continuation length as the RGR sweep (M5b train shards 0-3), TRAIN split only.
# Nothing is tuned on evaluation states: hidden-magnitude ranges are fixed on the 3 calibration states (tier calib).
defaults: [exp/rgr_sweep]
milestone: ACR
tag: acr
eval:
  n_workers: 8
acr:
  tier: B                       # calib | B | A
  mode: collect                 # collect | postprobe
  decisions: null               # postprobe: runs/_analysis/acr/decisions_<tier>.json
  instances: data/acr/instances.json
  shards: [0, 1, 2, 3]          # M5b shards the RGR sweep used (instances are reconstructed from them)
  precheck_from: ["runs/*_RGR_rgr_sweep_s*/precheck.csv"]
  out_root: data/acr/v1
  lane: 0
  num_lanes: 1
  max_states: 0
  families: [vla, hover, grasp_slow, grasp_firm, push_goal, retreat]
  n_real_var: 6                 # outcome-table variants per family and case (budgets B <= 8 read off the table)
  n_plan_var: 2                 # planning trials per family and particle
  cont_steps: 300               # frozen-pi continuation after the prefix (= search.continuation_max_steps)
  perception_sigma: 0.025       # simulated object / goal position noise of object-relative families (m)
  types:                        # hidden type -> magnitude range [lo, hi]; planning particles = the two ends
    # FROZEN 2026-11-09 16:05 UTC from the 3 calibration states (retryvla/causal/calibrate.py, runs/_analysis/acr/
    # calib_grid.csv; rule in PLAN "ACR"): anchored dropped (no outcome effect up to 100 N)
    slippery: [0.001, 0.03]     # finger sliding friction x (finger geom priority raised)
    heavy: [2.0, 4.0]           # object mass (kg; nominal bowl ~0.006); only 3.0 qualified on the grid
    weak_grip: [0.003, 0.1]     # gripper actuator force range x (nominal +-20 N)
