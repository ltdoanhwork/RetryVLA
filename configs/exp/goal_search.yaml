# 2610.05151 reverse direction: search on SEED-7 audit entries of M0 (pre-registered 2026-11-18): random vs wm_diverse,
# 16 sim verifications / entry / arm, paired continuation seeds, M0 continuation <= 300 steps, <= 4 trajs / entry.
defaults: [exp/m5b_compare_arms]
milestone: GOAL
tag: goal_search
env:
  resolution: 128
policy:
  path: runs/goal_rsi/m0_s7/ckpt_04000
  n_action_steps: 5
eval:
  n_workers: 10
goal:
  audit_dir: data/goal_rsi/audit_m0_s7
  audit_seed: 7
  max_entries: 0
m5b:
  arms: [random, wm_diverse]
  budget: 16
  pool_size: 256
  num_shards: 3
  shard: 0
  wm_link: data/wm/goal_latest_wm.txt
  critic_link: data/wm/goal_latest_critic.txt
  out_root: data/recovery/goal_search
  verif_out: data/wm/goal_verif
  worker_retries: 2
  oom_retries: 3
  write_retries: 8
