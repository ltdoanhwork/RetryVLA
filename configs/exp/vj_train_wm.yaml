# Foundation-WM test (RQ3 follow-up): fine-tune V-JEPA 2-AC (ViT-g encoder frozen, AC predictor ~300M) on the SAME
# bridges WM v1 was trained on (collect_v1, re-simulated -> frames -> pooled 8x8 V-JEPA latents). Same val split.
defaults: [env/libero_spatial, policy/smolvla_libero, eval/default]
milestone: RQ3
tag: vj_train_wm
vjwm:
  data_roots: [data/foundation/vj_latents/collect_v1]
  val_frac: 0.15
  seed: 0
  lr: 1.0e-4          # pretrained predictor (zero-shot open-loop ratio ~2x copy-frame: large domain gap)
  lr_fast: 1.0e-3     # new chunk-action encoder / state encoder / q_head
  weight_decay: 0.04
  batch_size: 8
  steps: 3000
  ar_steps: 4         # open-loop rollout loss over 4 model steps (V-JEPA 2-AC used 2; 10 was 7 s/step on the shared GPU)
  lam_q: 1.0
  ckpt_act: false     # ~8 GB with checkpointing; off = faster, ~20 GB
  n_val_eval: 256
  log_every: 50
  eval_every: 500
  out_link: data/foundation/latest_vj_wm.txt
