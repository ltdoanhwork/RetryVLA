# B3.2 main variant: advantage-CONDITIONED SFT on imagined data (RISE / RECAP style), PoC-matched recipe:
# init pi1-nominal, 6k optimizer steps, effective batch 32, lr 5e-5, 50% nominal demo replay, seed 0.
defaults: [exp/m4_sft_A_base_nom_random]
milestone: B32
tag: rise_sft_cond_pool
train:
  recovery_datasets: []          # no verified recoveries
  max_recovery_trajectories: null
  recovery_ratio: 0.5
  grad_accum: 2                  # 2 x 16 = 32 per optimizer step (shared, memory-loaded GPU)
rise_train:
  data_roots: [data/recovery/b32_rise/pool]
  mode: cond
  pos_frac: 0.3                  # top 30% imagined advantage of a failure state -> positive (RECAP-style ~30%)
  pos_min_adv: 0.0               # ... and A > 0 (the imagined end state is more competent than s_0)
  neg_frac: 0.5                  # bottom 50% -> negative
  p_pos: 0.5                     # share of positive samples within the imagined half
  pos_suffix: " Advantage: positive."
  neg_suffix: " Advantage: negative."
  demo_label: positive           # nominal demos are expert data -> positive
  clip_actions: true             # clip imagined chunks to the env action range [-1, 1] (what the robot would execute)
