# M2: recovery critic on real + WM-imagined end-of-segment latents.
defaults: [env/libero_spatial, policy/smolvla_libero, eval/default]
milestone: M2
tag: train_critic_v1
critic:
  data_roots: [data/wm/collect_v1]
  wm_link: data/wm/latest_wm.txt
  wm_ckpt: null
  width: 256
  depth: 3
  dropout: 0.1
  lr: 2.0e-4
  weight_decay: 0.05
  batch_size: 128
  steps: 8000
  imagined_frac: 0.5          # fraction of each batch using WM-imagined end latents
  topk: 4
  log_every: 100
  eval_every: 1000
  seed: 0
  out_link: data/wm/latest_critic.txt
