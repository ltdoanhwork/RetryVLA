# P2 controls for B4 (wm_success) on the SAME 122 paired M5b instances (select_seed 2026, shards 0-3 of 8), same
# pi0 / WM v1 / pool / budget 16 / continuation seeds as b2_value_search (wm_progress, wm_success), M5b and M9:
#   wm_success_nopi0  B4 without any pi0 label (data/wm/latest_critic_success_nopi0.txt)
#   wm_cpi_pool       only B4's pi0 labels             (data/wm/latest_critic_cpi_pool.txt)
# Both = wm_diverse with the critic swapped (retryvla/search/arms.py::arm_wm_value / VALUE_ARMS).
defaults: [exp/m9_mech_search]
milestone: B2
tag: valuex_search
eval:
  n_workers: 8            # <= 8 (shared node)
m5b:
  arms: [wm_success_nopi0, wm_cpi_pool]
  success_nopi0_critic_link: data/wm/latest_critic_success_nopi0.txt
  cpi_pool_critic_link: data/wm/latest_critic_cpi_pool.txt
  out_root: data/recovery/b2x_value
  write_retries: 8   # re-check + rewrite unreadable PNGs before save_episode (EDQUOT 2026-10-22)
  worker_retries: 2  # sim worker died (MuJoCo segfault): respawn pool + re-run batch, then skip instance
  verif_out: data/wm/verif_b2x_value
