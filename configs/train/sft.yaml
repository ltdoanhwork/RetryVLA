train:
  init_from: HuggingFaceVLA/smolvla_libero
  original_dataset: lerobot/libero
  original_suite_filter: libero_spatial  # keep only these tasks from the original dataset
  recovery_datasets: []                  # list of local LeRobotDataset roots
  recovery_ratio: 0.5                    # fraction of samples drawn from recovery data
  recovery_segments: [recovery, continuation]
  steps: 6000
  batch_size: 32
  num_workers: 8
  lr: 5.0e-5
  warmup_steps: 300
  weight_decay: 1.0e-10
  grad_clip: 10.0
  amp_dtype: bfloat16
  log_every: 50
  save_every: 2000
  seed: 0
